<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Studio Volt</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0a0a0a;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: 2rem;
        font-weight: 800;
        margin-bottom: 0.5rem;
      }
      h1 span {
        color: #facc15;
      }
      p {
        color: #94a3b8;
      }
      footer {
        position: fixed;
        bottom: 1.5rem;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 0.8rem;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Studio <span>Volt</span></h1>
      <p>Apps built in Switzerland</p>
    </div>
    <footer>&copy; 2026 Studio Volt</footer>
  </body>
</html>
